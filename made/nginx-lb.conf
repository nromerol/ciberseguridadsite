# ========================================
# NGINX - LOAD BALANCER Y PROXY REVERSO
# ========================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ========================================
    # OPTIMIZACIÓN DE PERFORMANCE
    # ========================================

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # ========================================
    # UPSTREAM - SERVIDORES DE APLICACIÓN
    # ========================================

    upstream made_backend {
        # Least connections load balancing
        least_conn;
        
        # 3 instancias del servidor
        server app-1:3000 weight=3 max_fails=3 fail_timeout=30s;
        server app-2:3000 weight=3 max_fails=3 fail_timeout=30s;
        server app-3:3000 weight=3 max_fails=3 fail_timeout=30s;
        
        # Mantener conexiones
        keepalive 32;
    }

    # ========================================
    # RATE LIMITING
    # ========================================

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=strict:10m rate=2r/s;

    # ========================================
    # REDIRECT HTTP A HTTPS
    # ========================================

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================
    # SERVER HTTPS PRINCIPAL
    # ========================================

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name yourdomain.com www.yourdomain.com;

        # ========================================
        # SSL/TLS
        # ========================================

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ========================================
        # HEADERS DE SEGURIDAD
        # ========================================

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:" always;

        # ========================================
        # PROXY Y LOAD BALANCING
        # ========================================

        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://made_backend;
            proxy_http_version 1.1;

            # Headers importantes para proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Keep-alive
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Retry en caso de error
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # ========================================
        # ENDPOINT DE SALUD (HEALTH CHECK)
        # ========================================

        location /health {
            access_log off;
            proxy_pass http://made_backend/api/security-status;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========================================
        # ENDPOINT DE MONITOREO
        # ========================================

        location /monitor {
            limit_req zone=strict burst=5 nodelay;
            
            proxy_pass http://made_backend:3001;
            access_log /var/log/nginx/monitor.log;
        }

        # ========================================
        # ARCHIVOS ESTÁTICOS
        # ========================================

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
            proxy_pass http://made_backend;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ========================================
        # DENEGACIÓN DE ARCHIVOS SENSIBLES
        # ========================================

        location ~ /\. {
            deny all;
        }

        location ~ \.(env|config|htaccess|json|xml|log)$ {
            deny all;
        }

        # ========================================
        # ERROR PAGES
        # ========================================

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ========================================
    # STATS PAGE (INTERNO)
    # ========================================

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
    }
}
