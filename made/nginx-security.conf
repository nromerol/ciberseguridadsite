# ========================================
# CONFIGURACIÓN NGINX - SEGURIDAD ROBUSTA
# ========================================
# Ubicar en: /etc/nginx/sites-enabled/made.conf

# Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name yourdomain.com www.yourdomain.com;
    root /var/www/made;
    index index.html;
    
    # ========================================
    # CERTIFICADOS SSL/TLS
    # ========================================
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # Configuración SSL segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # ========================================
    # HEADERS DE SEGURIDAD
    # ========================================
    
    # Content-Security-Policy - Previene XSS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    
    # X-Frame-Options - Previene clickjacking
    add_header X-Frame-Options "DENY" always;
    
    # X-Content-Type-Options - Previene MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # X-XSS-Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions-Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    
    # HSTS - Força HTTPS por 1 año
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Ocultar versión de nginx
    server_tokens off;
    
    # ========================================
    # ACCESO Y PERMISOS
    # ========================================
    
    # Negar acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
    
    # Negar acceso a archivos sensibles
    location ~ \.(htaccess|htpasswd|env|config|yml|yaml|json|log)$ {
        deny all;
    }
    
    # ========================================
    # GESTIÓN DE ARCHIVOS ESTÁTICOS
    # ========================================
    
    # Archivos estáticos con caché
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ========================================
    # COMPRESIÓN GZIP
    # ========================================
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    
    # ========================================
    # LIMIT DE RATE (DDoS básico)
    # ========================================
    
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req zone=general burst=20 nodelay;
    
    # ========================================
    # PREVENCIÓN DE ATAQUES COMUNES
    # ========================================
    
    # Bloquear intentos SQL injection en URL
    if ($args ~* union|select|insert|drop|delete|update|exec|script|inject) {
        return 403;
    }
    
    # Bloquear User-Agents sospechosos
    if ($http_user_agent ~* (bot|crawler|scraper|spider|nikto|nmap|sqlmap|nessus|masscan|dirbuster|metasploit)) {
        return 403;
    }
    
    # ========================================
    # LOGGING
    # ========================================
    
    access_log /var/log/nginx/made_access.log;
    error_log /var/log/nginx/made_error.log warn;
    
    # ========================================
    # PÁGINA PRINCIPAL
    # ========================================
    
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # ========================================
    # PÁGINA DE ERROR
    # ========================================
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

# ========================================
# LÍMITES GLOBALES
# ========================================

client_max_body_size 10M;
keepalive_timeout 65;
types_hash_max_size 2048;
