# ========================================
# MODSECURITY - WEB APPLICATION FIREWALL
# ========================================
# Ubicar en: /etc/modsecurity/modsecurity.conf

# Habilitar ModSecurity
SecRuleEngine On
SecAuditEngine On

# ========================================
# DETECCIÓN DE HERRAMIENTAS DE ATAQUE
# ========================================

# Bloquear Burp Suite
SecRule REQUEST_HEADERS:User-Agent "@contains BurpSuite" "id:1001,phase:2,deny,status:403,msg:'Burp Suite detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains burp" "id:1002,phase:2,deny,status:403,msg:'Herramienta de testing detectada'"

# Bloquear herramientas de scanning
SecRule REQUEST_HEADERS:User-Agent "@contains nmap" "id:1003,phase:2,deny,status:403,msg:'NMAP detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains nikto" "id:1004,phase:2,deny,status:403,msg:'Nikto detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains masscan" "id:1005,phase:2,deny,status:403,msg:'Masscan detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains nessus" "id:1006,phase:2,deny,status:403,msg:'Nessus detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains openvas" "id:1007,phase:2,deny,status:403,msg:'OpenVAS detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains metasploit" "id:1008,phase:2,deny,status:403,msg:'Metasploit detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains sqlmap" "id:1009,phase:2,deny,status:403,msg:'SQLMap detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains dirbuster" "id:1010,phase:2,deny,status:403,msg:'DirBuster detectado'"
SecRule REQUEST_HEADERS:User-Agent "@contains havij" "id:1011,phase:2,deny,status:403,msg:'Herramienta de ataque detectada'"
SecRule REQUEST_HEADERS:User-Agent "@contains acunetix" "id:1012,phase:2,deny,status:403,msg:'Acunetix detectado'"

# ========================================
# PROTECCIÓN CONTRA ENUMERACIÓN Y SCANNING
# ========================================

# Bloquear múltiples HEAD requests (port scanning)
SecRule REQUEST_METHOD "@streq HEAD" \
    "id:1100,phase:2,chain,msg:'Posible scanning de puertos'"
SecRule REQUEST_HEADERS:User-Agent "@contains bot|crawler" \
    "deny,status:403"

# Bloquear OPTIONS requests excesivos (fingerprinting)
SecRule REQUEST_METHOD "@streq OPTIONS" \
    "id:1101,phase:2,msg:'OPTIONS request'"

# ========================================
# PROTECCIÓN CONTRA DNS ATTACKS
# ========================================

# Validar Host header
SecRule REQUEST_HEADERS:Host "@px ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)*[a-z]{2,}$" \
    "id:1200,phase:1,negate,deny,status:400,msg:'Host header inválido - Posible DNS attack'"

# Prevenir DNS rebinding
SecRule REQUEST_HEADERS:Host "@contains 127.0.0.1|localhost|0.0.0.0" \
    "id:1201,phase:1,deny,status:403,msg:'DNS rebinding detectado'"

# ========================================
# PROTECCIÓN CONTRA ATAQUES HTTP
# ========================================

# HTTP Response Splitting
SecRule ARGS "@rx (?:\r\n|\n|%0[ad]|%[\da-f]{2})" \
    "id:1300,phase:2,deny,status:400,msg:'HTTP Response Splitting detectado'"

# HTTP Request Smuggling
SecRule REQUEST_HEADERS:Transfer-Encoding "@mx 1" \
    "id:1301,phase:2,chain,msg:'Posible HTTP Request Smuggling'"
SecRule REQUEST_HEADERS:Content-Length \
    "deny,status:400"

# Métodos HTTP no permitidos
SecRule REQUEST_METHOD "!@pm GET HEAD POST OPTIONS PUT DELETE PATCH" \
    "id:1302,phase:1,deny,status:405,msg:'Método HTTP no permitido'"

# ========================================
# PROTECCIÓN CONTRA INYECCIONES
# ========================================

# SQL Injection avanzado
SecRule ARGS|ARGS_NAMES "@rx (?i:union.*select|select.*from|insert.*into|delete.*from|drop.*table|update.*set|exec|execute|script|java|vbscript)" \
    "id:1400,phase:2,deny,status:403,msg:'SQL Injection detectado'"

# Command Injection
SecRule ARGS "@rx (?:\$\(|`|;\s*(?:cat|ls|wget|curl|nc)|&&|{\$|[\|]),img)" \
    "id:1401,phase:2,deny,status:403,msg:'Command Injection detectado'"

# XSS avanzado
SecRule ARGS "@rx <\s*script|javascript:|onerror|onload|onclick|on\w+\s*=|<iframe|<embed|<object" \
    "id:1402,phase:2,deny,status:403,msg:'XSS detectado'"

# Path Traversal
SecRule ARGS|URL "@rx \.\./|\.\.\\|%2e%2e" \
    "id:1403,phase:2,deny,status:403,msg:'Path Traversal detectado'"

# Log4j / JNDI Injection
SecRule ARGS "@rx \$\{jndi:" \
    "id:1404,phase:2,deny,status:403,msg:'JNDI Injection detectado'"

# ========================================
# RATE LIMITING Y FLOOD PROTECTION
# ========================================

# Limitar peticiones por IP (20 en 60 segundos)
SecRule IP:@collection_size "gt 20" \
    "id:1500,phase:1,deny,status:429,msg:'Rate limit excedido - Posible DDoS'"

# ========================================
# PROTECCIÓN CONTRA FUERZA BRUTA
# ========================================

# Detectar intentos fallidos de login
SecRule RESPONSE_STATUS "@streq 401|403|404" \
    "id:1600,phase:3,capture,nolog,pass"

# ========================================
# ACCESO A ARCHIVOS SENSIBLES
# ========================================

# Bloquear acceso a archivos de configuración
SecRule REQUEST_URI "@rx (?:\.env|\.config|\.git|\.svn|\.htaccess|web\.config|package\.json|composer\.lock|npm-debug|\.ssh|credentials|\.aws)" \
    "id:1700,phase:2,deny,status:403,msg:'Acceso a archivo sensible bloqueado'"

# Bloquear directorios administrativos
SecRule REQUEST_URI "@rx /admin|/wp-admin|/phpmyadmin|/cpanel|/cPanel" \
    "id:1701,phase:2,deny,status:403,msg:'Acceso administrativo bloqueado'"

# ========================================
# VALIDACIÓN DE INTEGRIDAD
# ========================================

# Validar Content-Type
SecRule REQUEST_HEADERS:Content-Type "!@rx ^(application/json|application/x-www-form-urlencoded|multipart/form-data|text/plain)$" \
    "id:1800,phase:1,chain,msg:'Content-Type sospechoso'"
SecRule REQUEST_METHOD "@pm POST PUT PATCH" \
    "deny,status:400"

# ========================================
# LOGGING Y ALERTAS
# ========================================

# Archivo de logs
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogFormat JSON

# Límite de tamaño de log
SecAuditLogStorageDir /var/log/modsecurity/
SecAuditLogRelevantStatus "^(?:4|5)\d{2}$"

# ========================================
# REGLAS PERSONALIZADAS
# ========================================

# Bloquear User-Agents vacíos (herramientas de ataque)
SecRule REQUEST_HEADERS:User-Agent "^$" \
    "id:1900,phase:1,deny,status:403,msg:'User-Agent vacío - Herramienta de ataque sospechosa'"

# Detectar excesivos redirects (posible ataque de loop)
SecRule RESPONSE_HEADERS:Location "@ms /" \
    "id:1901,phase:3,msg:'Redirect detectado'"

# ========================================
# CONFIGURACIÓN GLOBAL
# ========================================

# Timeout
SecRequestBodyTimeout 120
SecResponseBodyTimeout 120

# Límite de tamaño de request
SecRequestBodyLimit 1048576
SecRequestBodyNoFiles Off

# Argumentos máximos
SecRequestBodyInMemoryLimit 131072
