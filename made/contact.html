<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto - MADE Ciberseguridad</title>
    
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .turnstile-container {
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        
        .cf-turnstile {
            display: flex;
            justify-content: center;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .alert.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .security-info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        
        .security-info span {
            display: block;
            margin: 5px 0;
        }
        
        .lock-icon {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Contacto Seguro</h1>
            <p>Protegido con Cloudflare Turnstile</p>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    placeholder="Tu nombre"
                >
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="tu@email.com"
                >
            </div>
            
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea 
                    id="message" 
                    name="message" 
                    required 
                    placeholder="Tu mensaje..."
                ></textarea>
            </div>
            
            <!-- Cloudflare Turnstile Widget -->
            <div class="turnstile-container">
                <div 
                    class="cf-turnstile" 
                    data-sitekey="0x4AAAAAADB4e0yke-xx4rs6"
                    data-theme="light"
                    data-callback="onTurnstileSuccess"
                    data-error-callback="onTurnstileError"
                >
                </div>
            </div>
            
            <button type="submit" id="submitBtn">
                Enviar Mensaje Seguro
            </button>
        </form>
        
        <div class="security-info">
            <span class="lock-icon">🔐 Este formulario está protegido por:</span>
            <span>✅ Cloudflare Turnstile (Anti-Bot)</span>
            <span>✅ HTTPS/TLS Encriptado</span>
            <span>✅ Rate Limiting</span>
            <span>✅ IDS Monitorizado</span>
        </div>
    </div>
    
    <script>
        // Estado del Turnstile
        let turnstileVerified = false;
        let turnstileResponse = null;
        
        /**
         * Callback cuando Turnstile es verificado exitosamente
         */
        function onTurnstileSuccess(token) {
            turnstileVerified = true;
            turnstileResponse = token;
            console.log('✅ Turnstile verificado:', token);
            showAlert('Verificación completada. Puedes enviar el formulario.', 'success');
        }
        
        /**
         * Callback cuando hay error en Turnstile
         */
        function onTurnstileError() {
            turnstileVerified = false;
            turnstileResponse = null;
            console.warn('❌ Error en verificación de Turnstile');
            showAlert('Error en la verificación. Por favor intenta de nuevo.', 'error');
        }
        
        /**
         * Muestra alertas
         */
        function showAlert(message, type = 'info') {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert ${type}`;
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    alertEl.className = 'alert';
                }, 5000);
            }
        }
        
        /**
         * Maneja el envío del formulario
         */
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Verificar que Turnstile fue completado
            if (!turnstileVerified) {
                showAlert('Por favor completa la verificación de seguridad (Turnstile)', 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            // Deshabilitar botón
            submitBtn.disabled = true;
            showAlert('Enviando mensaje...', 'loading');
            
            try {
                // Enviar forma con token de Turnstile
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        message,
                        'cf-turnstile-response': turnstileResponse
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showAlert('✅ Mensaje enviado exitosamente. Gracias por contactarnos.', 'success');
                    
                    // Limpiar formulario
                    document.getElementById('contactForm').reset();
                    
                    // Reset Turnstile
                    turnstileVerified = false;
                    turnstileResponse = null;
                    window.turnstile.reset();
                    
                    // Re-habilitar botón después de 3 segundos
                    setTimeout(() => {
                        submitBtn.disabled = false;
                    }, 3000);
                } else {
                    showAlert(
                        `❌ Error: ${data.error || 'No se pudo enviar el mensaje'}`,
                        'error'
                    );
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert(`❌ Error de conexión: ${error.message}`, 'error');
                submitBtn.disabled = false;
            }
        });
        
        // Log inicial
        console.log('🔒 Página de contacto segura cargada');
        console.log('✅ Cloudflare Turnstile habilitado');
        console.log('🛡️ Protecciones activas: HTTPS, CSP, IDS');
    </script>
</body>
</html>
