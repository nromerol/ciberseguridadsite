version: '3.8'

services:
  # ========================================
  # NGINX - LOAD BALANCER Y PROXY REVERSO
  # ========================================
  nginx:
    image: nginx:latest
    container_name: made-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx:rw
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app-1
      - app-2
      - app-3
    networks:
      - made-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # INSTANCIA 1 DEL SERVIDOR
  # ========================================
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: made-app-1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=1
    ports:
      - "3001:3000"
      - "3101:3001"
    volumes:
      - ./logs:/app/logs:rw
      - ./public:/app/public:ro
    networks:
      - made-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/security-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # INSTANCIA 2 DEL SERVIDOR
  # ========================================
  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: made-app-2
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=2
    ports:
      - "3002:3000"
      - "3102:3001"
    volumes:
      - ./logs:/app/logs:rw
      - ./public:/app/public:ro
    networks:
      - made-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/security-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # INSTANCIA 3 DEL SERVIDOR
  # ========================================
  app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: made-app-3
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=3
    ports:
      - "3003:3000"
      - "3103:3001"
    volumes:
      - ./logs:/app/logs:rw
      - ./public:/app/public:ro
    networks:
      - made-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/security-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # REDIS - CACHE DISTRIBUIDO Y SESSIONS
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: made-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - made-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass secure_password_here
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # PROMETHEUS - MONITOREO DE MÉTRICAS
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: made-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - made-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  # ========================================
  # GRAFANA - VISUALIZACIÓN DE MÉTRICAS
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: made-grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - made-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ========================================
  # BACKUP AUTOMÁTICO
  # ========================================
  backup:
    image: node:18-alpine
    container_name: made-backup
    volumes:
      - ./:/app:ro
      - ./backups:/backups:rw
      - /etc/localtime:/etc/localtime:ro
    working_dir: /app
    networks:
      - made-network
    restart: unless-stopped
    entrypoint: sh -c 'apk add --no-cache tar gzip && while true; do tar -czf /backups/backup-$(date +%Y%m%d-%H%M%S).tar.gz . && find /backups -name "backup-*.tar.gz" -mtime +7 -delete && echo "Backup completado $(date)" && sleep 3600; done'

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  made-network:
    driver: bridge
